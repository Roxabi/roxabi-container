name: Build and push ml-base cu130 image

on:
  push:
    branches: [main, staging]
    paths:
      - images/ml-base-cu130/**
      - .github/workflows/build-ml-base-cu130.yml
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to push alongside branch default (e.g. test)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: roxabi/ml-base

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cu130-staging"
          else
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cu130-py312-torch2.12.0"
          fi
          if [ -n "${{ inputs.tag }}" ]; then
            TAGS="${TAGS}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${TAGS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/ml-base-cu130
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cu130
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-cu130,mode=max