name: Build and push base-svc image

on:
  push:
    branches: [main]
    paths: [images/base-svc/**]
  schedule:
    - cron: '0 5 * * 1'  # Every Monday 05:00 UTC (1h offset from base to avoid runner contention)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to push alongside :latest (e.g. test, staging)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: roxabi/base-svc

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          # Manual dispatch with extra tag
          if [ -n "${{ inputs.tag }}" ]; then
            TAGS="${TAGS}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${TAGS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/base-svc
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
